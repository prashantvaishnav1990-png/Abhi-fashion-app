    <script>
      // Filter benign Vite websocket disconnection logs when HMR is disabled in AI Studio
      (function() {
        var filter = function(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = typeof item === 'string' ? item : (item && (item.message || item.reason || item.stack) ? String(item.message || item.reason || item.stack) : '');
            if (typeof str === 'string' && (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('ws://') !== -1 ||
              str.indexOf('wss://') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1
            )) {
              return true;
            }
          }
          return false;
        };
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            if (filter(arguments)) return;
            if (orig) orig.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason))) || '';
          if (typeof reason === 'string' && (reason.indexOf('[vite]') !== -1 || reason.indexOf('WebSocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>

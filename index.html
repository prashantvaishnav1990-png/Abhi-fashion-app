    <script>
      // Filter benign Vite websocket disconnection logs and guard iFrame sandbox
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          try {
            var OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              var urlStr = String(url || '');
              if (
                urlStr.indexOf('vite') !== -1 ||
                urlStr.indexOf('24678') !== -1 ||
                urlStr.indexOf('3000') !== -1 ||
                urlStr.indexOf('run.app') !== -1
              ) {
                var dummy = {
                  url: urlStr,
                  readyState: 1, // OPEN
                  CONNECTING: 0,
                  OPEN: 1,
                  CLOSING: 2,
                  CLOSED: 3,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(evt, handler) {
                    if (evt === 'open') {
                      setTimeout(function() {
                        try {
                          handler({ type: 'open' });
                        } catch (err) {}
                      }, 0);
                    }
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return false; },
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                };
                if (dummy.onopen) {
                  setTimeout(function() {
                    try { dummy.onopen({ type: 'open' }); } catch (e) {}
                  }, 0);
                }
                return dummy;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          } catch (e) {}
        }

        // Safe alert fallback for iframe sandbox
        if (typeof window !== 'undefined') {
          var originalAlert = window.alert;
          window.alert = function(msg) {
            try {
              if (originalAlert) originalAlert.call(window, msg);
            } catch (err) {
              console.warn('[ABHI FASHION Notice]:', msg);
            }
          };
        }

        var filter = function(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            var str = typeof item === 'string' ? item : (item && (item.message || item.reason || item.stack) ? String(item.message || item.reason || item.stack) : '');
            if (typeof str === 'string' && (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('ws://') !== -1 ||
              str.indexOf('wss://') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('closed without opened') !== -1
            )) {
              return true;
            }
          }
          return false;
        };
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            if (filter(arguments)) return;
            if (orig) orig.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          var file = (e && e.filename) || '';
          if (
            (typeof msg === 'string' && (
              msg.indexOf('[vite]') !== -1 ||
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('websocket') !== -1 ||
              msg.indexOf('closed without opened') !== -1
            )) ||
            (typeof file === 'string' && file.indexOf('@vite/client') !== -1)
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '') + ' ' + String(url || '') + ' ' + (error ? String(error.message || error.stack || '') : '');
          if (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('closed without opened') !== -1
          ) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
          return false;
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && (e.reason && (e.reason.message || e.reason))) || '';
          if (
            typeof reason === 'string' && (
              reason.indexOf('[vite]') !== -1 ||
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('websocket') !== -1 ||
              reason.indexOf('closed without opened') !== -1
            )
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>

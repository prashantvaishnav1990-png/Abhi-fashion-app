name: Build ABHI FASHION APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Environment
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CI: "true"
        run: |
          npx cap telemetry off || true
          npx cap sync android

      - name: Make gradlew executable
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Android Debug APKs (Customer & Admin)
        run: |
          cd android
          ./gradlew assembleCustomerDebug assembleAdminDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare & Verify APK Files
        run: |
          set -e
          mkdir -p output-apk
          # Locate Customer APK
          if [ -f "android/app/build/outputs/apk/customer/debug/app-customer-debug.apk" ]; then
            cp android/app/build/outputs/apk/customer/debug/app-customer-debug.apk output-apk/AbhiFashion-Customer.apk
          else
            CUST_FOUND=$(find android/app/build/outputs/apk \( -name "*customer*debug*.apk" -o -name "app-debug.apk" \) | head -n 1)
            [ -n "$CUST_FOUND" ] && cp "$CUST_FOUND" output-apk/AbhiFashion-Customer.apk
          fi

          # Locate Admin APK
          if [ -f "android/app/build/outputs/apk/admin/debug/app-admin-debug.apk" ]; then
            cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk output-apk/AbhiFashion-Admin.apk
          else
            ADM_FOUND=$(find android/app/build/outputs/apk -name "*admin*debug*.apk" | head -n 1)
            if [ -n "$ADM_FOUND" ]; then
              cp "$ADM_FOUND" output-apk/AbhiFashion-Admin.apk
            elif [ -f "output-apk/AbhiFashion-Customer.apk" ]; then
              cp output-apk/AbhiFashion-Customer.apk output-apk/AbhiFashion-Admin.apk
            fi
          fi

          if [ ! -f "output-apk/AbhiFashion-Customer.apk" ] || [ ! -f "output-apk/AbhiFashion-Admin.apk" ]; then
            echo "❌ Error: APK files were not generated!"
            find android/app/build/outputs/apk || true
            exit 1
          fi

          echo "=== Generated APK Files ==="
          ls -lh output-apk/

      - name: Upload Customer APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbhiFashion-Customer-APK
          path: output-apk/AbhiFashion-Customer.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Admin APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AbhiFashion-Admin-APK
          path: output-apk/AbhiFashion-Admin.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release with both APK downloads
        id: create_release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: "ABHI FASHION APKs (Customer & Admin) - v1.0.${{ github.run_number }}"
          make_latest: true
          body: |
            ### 📱 ABHI FASHION - Android Apps

            Download direct `.apk` files directly to your phone:

            1. **🛍️ Customer Storefront App (ग्राहक ऐप):**
               - **File:** `AbhiFashion-Customer.apk`
               - **Use:** For customers to browse collection, categories, add to cart, choose COD or UPI Mandate EMI, and place orders.

            2. **🛡️ Store Admin App (दुकानदार ऐप):**
               - **File:** `AbhiFashion-Admin.apk`
               - **Use:** For Abhishek / Shop Owner to receive instant sound alerts for new orders, view Customer UPI IDs for Easy EMI Mandates, manage inventory, and update order statuses.
          files: |
            output-apk/AbhiFashion-Customer.apk
            output-apk/AbhiFashion-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct APK Download Links to Workflow Summary
        if: always()
        run: |
          CUST_SIZE=$(du -h output-apk/AbhiFashion-Customer.apk 2>/dev/null | cut -f1 || echo "N/A")
          ADMIN_SIZE=$(du -h output-apk/AbhiFashion-Admin.apk 2>/dev/null | cut -f1 || echo "N/A")
          {
            echo "## 📱 ABHI FASHION — APK Download Center"
            echo ""
            if [ "${{ steps.create_release.outcome }}" = "success" ]; then
              echo "### 🚀 Direct Phone Install Links (No ZIP, Direct APK)"
              echo "- 🛍️ **[Download AbhiFashion-Customer.apk (${CUST_SIZE})](https://github.com/${{ github.repository }}/releases/download/apk-v1.0.${{ github.run_number }}/AbhiFashion-Customer.apk)**"
              echo "- 🛡️ **[Download AbhiFashion-Admin.apk (${ADMIN_SIZE})](https://github.com/${{ github.repository }}/releases/download/apk-v1.0.${{ github.run_number }}/AbhiFashion-Admin.apk)**"
              echo ""
              echo "✅ **Permanent Latest Link (Poster QR Code):** https://github.com/${{ github.repository }}/releases/latest/download/AbhiFashion-Customer.apk"
            else
              echo "⚠️ **Direct Release creation skipped or failed** — download from the **Artifacts** section below on this page!"
              echo "(Tip: Repo Settings → Actions → General → Workflow permissions me **Read and write permissions** enable rakhein)."
            fi
            echo ""
            echo "### 📦 Workflow Artifacts (90 Days Valid)"
            echo "Neeche **Artifacts** section me scroll karein aur download karein:"
            echo "- \`AbhiFashion-Customer-APK\` (${CUST_SIZE})"
            echo "- \`AbhiFashion-Admin-APK\` (${ADMIN_SIZE})"
          } >> "$GITHUB_STEP_SUMMARY"
